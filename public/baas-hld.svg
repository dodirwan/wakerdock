      <path d="M5 29v-5a11 11 0 0 1 22 0v5Z" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M12 23l-3 3 3 3m8-6 3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="shield" viewBox="0 0 32 32">
