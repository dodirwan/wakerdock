      <path d="M16 7v18M8 12l16 8M8 20l16-8" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #e9f3fc; }
      .muted { fill: #aec5d9; }
      .cyan { fill: #70ddf7; }
      .green { fill: #a1edbe; }
      .panel { fill: #0f2237; stroke: #2a4964; stroke-width: 1.3; }
      .vpc { fill: #0a192a; stroke: #3b6178; stroke-width: 1.2; }
      .workload { fill: #122c43; stroke: #2c526d; stroke-width: 1; }
      .storage { fill: #10263b; stroke: #34617b; stroke-width: 1; }
      .bucket-card { fill: #173a50; stroke: #3a7087; stroke-width: 1; }
      .backup { fill: none; stroke: #61dafa; stroke-width: 2; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#backup-arrow); }
      .management { fill: none; stroke: #8ce5af; stroke-width: 2; stroke-dasharray: 5 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#management-arrow); }
    </style>
  </defs>

