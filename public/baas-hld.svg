<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title description">
  <title id="title">BERCA MSP · BACKUP AS A SERVICE</title>
  <desc id="description">Hybrid multi-tenant architecture in AWS region ap-southeast-3 and on premises. User_Tenant_X in ap-southeast-3c retains the source label Tenant_Y_VPC. User_Tenant_Y in ap-southeast-3b retains the source label Tenant_X_VPC. Dashed cyan arrows carry workload backups to the Berca MSP Cohesity cluster. Helios centrally manages the AWS MSP cluster and the on-premises Fortknow_Backup_Cluster through dashed green connections. An administrator accesses Helios using secure communication. Both backup environments have tenant X, Y and Z external S3 storage domains, each with a 10TB bucket. No cloud-to-on-premises replication is depicted.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1c32"/>
      <stop offset="1" stop-color="#050d1b"/>
    </linearGradient>
    <linearGradient id="cloud-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11283e"/>
      <stop offset="1" stop-color="#0a1729"/>
    </linearGradient>
    <linearGradient id="cluster-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b3d"/>
      <stop offset="1" stop-color="#10282f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#75b8da" stroke-opacity=".035"/>
    </pattern>
    <marker id="backup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#61dafa"/>
    </marker>
    <marker id="management-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#8ce5af"/>
    </marker>
    <marker id="secure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#c5d8e9"/>
    </marker>
    <symbol id="cloud" viewBox="0 0 32 32">
      <path d="M8 25h17a6 6 0 0 0 1-12 10 10 0 0 0-19-2A7 7 0 0 0 8 25Z" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="server" viewBox="0 0 32 32">
      <rect x="3" y="4" width="26" height="10" rx="3" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.6"/>
      <rect x="3" y="18" width="26" height="10" rx="3" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 9h10M8 23h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="24" cy="9" r="1.5" fill="currentColor"/>
      <circle cx="24" cy="23" r="1.5" fill="currentColor"/>
    </symbol>
    <symbol id="database" viewBox="0 0 32 32">
