      <ellipse cx="16" cy="8" rx="11" ry="5" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.6"/>
      <path d="M5 16c0 3 5 5 11 5s11-2 11-5" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="bucket" viewBox="0 0 32 32">
      <path d="M5 8l3 19c4 3 12 3 16 0l3-19" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <ellipse cx="16" cy="8" rx="11" ry="4" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="user" viewBox="0 0 32 32">
